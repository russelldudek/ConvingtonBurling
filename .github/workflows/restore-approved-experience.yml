name: Restore approved Covington experience

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-approved-experience.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore exact approved presentation
        shell: bash
        run: |
          set -euo pipefail

          APPROVED_INDEX_SHA='4869037d4c70f4b8d49ae068c134a2e18bcd6dda'
          APPROVED_STYLES_SHA='e220bc140fc04cb1c32cc79f165fda5d574648f9'
          APPROVED_APP_SHA='3522b44888726d4a97380f04321b03dacdfdda1c'

          test "$(git hash-object index.html)" = "$APPROVED_INDEX_SHA"
          test "$(git hash-object styles.css)" = "$APPROVED_STYLES_SHA"
          test "$(git hash-object app.js)" = "$APPROVED_APP_SHA"

          cp index.html index-direct.html

          python3 - <<'PY'
          from pathlib import Path

          old_url = 'https://russelldudek.github.io/AIAction/'
          new_url = 'https://russelldudek.github.io/ConvingtonBurling/'

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_url, new_url)
              path.write_text(text, encoding='utf-8')

          resume = Path('resume.html')
          text = resume.read_text(encoding='utf-8')
          text = text.replace('<li>Food Safety Management Certification</li>', '')
          resume.write_text(text, encoding='utf-8')

          standalone = Path('index-direct.html')
          text = standalone.read_text(encoding='utf-8')
          text = text.replace('href="index.html"', 'href="index-direct.html"')
          standalone.write_text(text, encoding='utf-8')
          PY

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
            <meta name="theme-color" content="#07162f">
            <title>Russell Dudek | Covington Director of Applied AI Candidate Vision</title>
            <meta name="description" content="An independent candidate vision for leading applied AI delivery across Covington's legal practices.">
            <style>
              :root{color-scheme:dark;background:#07162f}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07162f;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.shell{position:fixed;inset:0;background:#07162f}.viewer{display:block;width:100%;height:100%;border:0;background:#07162f}.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:2;background:radial-gradient(circle at 72% 25%,#102f62 0,transparent 36%),#07162f;color:#fff;transition:opacity .45s ease,visibility .45s ease}.loading[hidden]{opacity:0;visibility:hidden}.mark{width:min(420px,calc(100vw - 48px));text-align:center}.rule{width:2px;height:72px;margin:0 auto 24px;background:linear-gradient(#2e7df7,#c6a264);box-shadow:0 0 24px rgba(46,125,247,.6)}.loading p{margin:0;color:#91a6c3;font-size:10px;font-weight:800;letter-spacing:.19em;text-transform:uppercase}.loading h1{margin:16px 0 0;font:500 clamp(34px,7vw,64px)/.98 Georgia,"Times New Roman",serif;letter-spacing:-.04em}.fallback{position:fixed;right:16px;bottom:16px;z-index:3;padding:10px 13px;border:1px solid rgba(255,255,255,.35);background:rgba(7,22,47,.82);backdrop-filter:blur(12px);color:#fff;text-decoration:none;font-size:11px;font-weight:750;letter-spacing:.04em}.fallback:focus-visible{outline:2px solid #7cb1ff;outline-offset:3px}@media(prefers-reduced-motion:reduce){.loading{transition:none}}
            </style>
          </head>
          <body>
            <main class="shell">
              <div class="loading" id="loading" aria-live="polite">
                <div class="mark"><div class="rule" aria-hidden="true"></div><p>Covington &amp; Burling LLP · Independent candidate vision</p><h1>Living Precedent Engine</h1></div>
              </div>
              <iframe
                class="viewer"
                id="viewer"
                title="Covington Director of Applied AI candidate vision by Russell Dudek"
                src="index-direct.html"
                allow="fullscreen"
              ></iframe>
              <a class="fallback" href="index-direct.html" target="_blank" rel="noopener">Open standalone ↗</a>
            </main>
            <script>
              const viewer=document.getElementById('viewer');
              const loading=document.getElementById('loading');
              viewer.addEventListener('load',()=>{loading.hidden=true},{once:true});
              window.setTimeout(()=>{loading.hidden=true},6000);
            </script>
          </body>
          </html>
          HTML

          grep -q 'Living Precedent Engine' index-direct.html
          grep -q 'src="index-direct.html"' index.html
          grep -q 'https://russelldudek.github.io/ConvingtonBurling/' resume.html
          ! grep -Rni --include='*.html' 'Food Safety Management Certification' .
          test "$(git hash-object styles.css)" = "$APPROVED_STYLES_SHA"
          test "$(git hash-object app.js)" = "$APPROVED_APP_SHA"

      - name: Regenerate campaign PDFs
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium

          python3 -m http.server 4173 >/tmp/covington-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2

          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');

          const jobs = [
            ['resume.html', 'pdfs/Russell-Dudek-Covington-Resume.pdf'],
            ['cover-letter.html', 'pdfs/Russell-Dudek-Covington-Cover-Letter.pdf'],
            ['interview-brief.html', 'pdfs/Russell-Dudek-Covington-Interview-Brief.pdf'],
            ['120-day-plan.html', 'pdfs/Russell-Dudek-Covington-120-Day-Plan.pdf'],
            ['workflow-precedent-review.html', 'pdfs/Russell-Dudek-Covington-Workflow-Precedent-Review.pdf'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            for (const [route, output] of jobs) {
              await page.goto(`http://127.0.0.1:4173/${route}`, { waitUntil: 'networkidle' });
              await page.emulateMedia({ media: 'print' });
              await page.evaluate(() => document.fonts.ready);
              await page.pdf({
                path: path.resolve(output),
                format: 'Letter',
                printBackground: true,
                preferCSSPageSize: true,
                margin: { top: '0', right: '0', bottom: '0', left: '0' },
              });
            }
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

          python3 -m pip install --quiet pypdf
          python3 - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          expected = {
              'pdfs/Russell-Dudek-Covington-Resume.pdf': 2,
              'pdfs/Russell-Dudek-Covington-Cover-Letter.pdf': 1,
              'pdfs/Russell-Dudek-Covington-Interview-Brief.pdf': 4,
              'pdfs/Russell-Dudek-Covington-120-Day-Plan.pdf': 3,
              'pdfs/Russell-Dudek-Covington-Workflow-Precedent-Review.pdf': 2,
          }
          for filename, pages in expected.items():
              reader = PdfReader(filename)
              actual = len(reader.pages)
              if actual != pages:
                  raise SystemExit(f'{filename}: expected {pages} pages, found {actual}')

          resume_text = '\n'.join(page.extract_text() or '' for page in PdfReader('pdfs/Russell-Dudek-Covington-Resume.pdf').pages)
          if 'Food Safety Management Certification' in resume_text:
              raise SystemExit('Food Safety Management Certification remains in resume PDF')
          if 'https://russelldudek.github.io/ConvingtonBurling/' not in resume_text:
              raise SystemExit('Correct candidate-vision URL missing from resume PDF')
          PY

          rm -rf node_modules package.json package-lock.json

      - name: Commit restored experience
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index-direct.html '*.html' pdfs/*.pdf
          git commit -m 'Restore approved Covington experience and tighten credentials'
          git push
