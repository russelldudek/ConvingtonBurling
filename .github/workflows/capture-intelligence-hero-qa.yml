name: Capture intelligence hero QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/capture-intelligence-hero-qa.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and capture
        shell: bash
        run: |
          mkdir -p qa-output
          set +e
          {
            node --check hero-intelligence.js
            npm init -y
            npm install playwright@1.55.0
            npx playwright install --with-deps chromium
            cat > /tmp/check.mjs <<'JS'
            import { chromium } from 'playwright';
            import assert from 'node:assert/strict';
            import fs from 'node:fs';
            const target=process.argv[2], prefix=process.argv[3];
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:1000}});
            const errors=[];
            page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto(target,{waitUntil:'networkidle',timeout:90000});
            await page.waitForSelector('#intelligenceCanvas');
            await page.waitForTimeout(1500);
            const state=await page.evaluate(()=>{const c=document.querySelector('#intelligenceCanvas'),g=c?.getContext('webgl2');return{treatment:document.body.dataset.treatment,mode:document.querySelector('#heroEngine')?.dataset.intelligenceMode,webgl:Boolean(g),version:g?.getParameter(g.VERSION)||'',width:c?.width||0,height:c?.height||0,legacy:document.querySelectorAll('.engine-layer').length,first:document.querySelector('.lab-controls>.control-group')?.id||'',cta:document.querySelector('.hero-primary')?.getAttribute('href')||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
            assert.equal(state.treatment,'prototype');assert.equal(state.mode,'prototype');assert.equal(state.webgl,true);assert.ok(state.width>800&&state.height>500);assert.equal(state.legacy,0);assert.equal(state.first,'treatmentControls');assert.equal(state.cta,'#treatmentControls');assert.equal(state.overflow,0);
            await page.screenshot({path:`qa-output/${prefix}-hero-prototype.png`});
            await page.locator('[data-stage="practice"]').click();
            await page.waitForFunction(()=>document.body.dataset.treatment==='practice'&&document.querySelector('#heroEngine')?.dataset.intelligenceMode==='practice');
            assert.equal(await page.locator('#heroTreatment').innerText(),'Practice pattern');
            await page.screenshot({path:`qa-output/${prefix}-hero-practice.png`});
            await page.locator('.hero-primary').click();await page.waitForTimeout(700);
            await page.screenshot({path:`qa-output/${prefix}-treatment-entry.png`});
            await page.setViewportSize({width:390,height:844});await page.goto(target,{waitUntil:'networkidle',timeout:90000});await page.waitForTimeout(900);assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth),0);await page.screenshot({path:`qa-output/${prefix}-hero-mobile.png`});
            assert.deepEqual(errors,[]);
            fs.writeFileSync(`qa-output/${prefix}-state.json`,JSON.stringify({target,state,errors,outcome:'success'},null,2));
            await browser.close();
            JS
            python3 -m http.server 4173 >/tmp/server.log 2>&1 & server=$!; sleep 2
            node /tmp/check.mjs http://127.0.0.1:4173/index-direct.html local
            kill "$server" || true
            LIVE=https://russelldudek.github.io/ConvingtonBurling
            ready=0
            for i in $(seq 1 36); do if curl -fsS "$LIVE/hero-intelligence.js?x=$i" -o /tmp/live.js && cmp -s hero-intelligence.js /tmp/live.js; then ready=1;break;fi;sleep 5;done
            test "$ready" = 1
            node /tmp/check.mjs "$LIVE/index-direct.html" live
          } >qa-output/qa.log 2>&1
          code=$?
          echo "$code" >qa-output/exit-code.txt
          [ "$code" = 0 ] && echo success >qa-output/outcome.txt || echo failure >qa-output/outcome.txt
          exit 0
      - name: Commit forced QA evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/capture-intelligence-hero-qa.yml
          git add -f qa-output
          git commit -m "Capture intelligence hero QA evidence"
          git push
