name: Materialize intelligence hero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-intelligence-hero.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace hero and wire local assets
        shell: bash
        env:
          HERO_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os

          path = Path('index-direct.html')
          text = path.read_text()
          if 'hero-intelligence.css' not in text:
              text = text.replace('<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="styles.css">\n  <link rel="stylesheet" href="hero-intelligence.css">', 1)
          if 'hero-intelligence.js' not in text:
              text = text.replace('<script src="app.js" defer></script>', '<script src="app.js" defer></script>\n  <script src="hero-intelligence.js" defer></script>', 1)

          start = text.index('    <section class="hero"')
          end = text.index('    <section class="mandate-section', start)
          hero = base64.b64decode(os.environ['HERO_B64']).decode()
          text = text[:start] + hero + '\n' + text[end:]
          path.write_text(text)
          PY
      - name: Commit completed hero
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-intelligence-hero.yml
          git add index-direct.html hero-intelligence.css hero-intelligence.js
          git commit -m "Replace stacked hero with living intelligence field"
          git push
