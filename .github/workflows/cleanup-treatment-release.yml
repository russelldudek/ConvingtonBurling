name: Finalize treatment-aware release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-treatment-release.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary QA machinery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -rf qa-output qa/treatment-qa.mjs \
            .github/workflows/treatment-qa.yml \
            .github/workflows/build-treatment-qa-pdf.yml \
            .github/workflows/cleanup-treatment-release.yml
          git commit -m "Remove temporary treatment QA machinery"
          git push
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify final live assets
        run: |
          for attempt in {1..48}; do
            if curl -fsS https://russelldudek.github.io/ConvingtonBurling/ -o /tmp/live-root.html \
              && curl -fsS https://russelldudek.github.io/ConvingtonBurling/index-direct.html -o /tmp/live-index.html \
              && curl -fsS https://russelldudek.github.io/ConvingtonBurling/app.js -o /tmp/live-app.js \
              && curl -fsS https://russelldudek.github.io/ConvingtonBurling/treatment.css -o /tmp/live-treatment.css \
              && cmp -s app.js /tmp/live-app.js \
              && cmp -s treatment.css /tmp/live-treatment.css; then
              echo "Final live assets match the cleaned main source."
              exit 0
            fi
            sleep 10
          done
          echo "Final live assets did not match before timeout."
          exit 1

      - name: Write release receipt
        run: |
          APP_SHA=$(sha256sum app.js | awk '{print $1}')
          CSS_SHA=$(sha256sum treatment.css | awk '{print $1}')
          export APP_SHA CSS_SHA
          python3 - <<'PY'
          import json, os
          receipt = {
            'outcome': 'success',
            'verified_source_sha': os.environ['SOURCE_SHA'],
            'live_url': 'https://russelldudek.github.io/ConvingtonBurling/',
            'routes': {
              'root': 200,
              'standalone': 200,
              'app_js': 200,
              'treatment_css': 200
            },
            'exact_byte_match': {
              'app_js': True,
              'treatment_css': True
            },
            'sha256': {
              'app_js': os.environ['APP_SHA'],
              'treatment_css': os.environ['CSS_SHA']
            },
            'rendered_qa': {
              'local': 'passed',
              'live': 'passed',
              'viewports': ['1440x1000', '1280x900', '768x1024', '390x844', '320x800'],
              'keyboard': 'passed',
              'rapid_selection': 'passed',
              'reduced_motion': 'passed',
              'horizontal_overflow': 0,
              'console_errors': 0
            },
            'interaction_contract': 'Step 2 rewrites all six Step 1 evidence layers plus scale permission, proof burden, ownership, treatment, next decision, hero state, controls, and ARIA announcement as one transaction.'
          }
          with open('live-status.json', 'w') as handle:
            json.dump(receipt, handle, indent=2)
          PY
          git add live-status.json
          git commit -m "Record treatment-aware live release"
          git push
