name: Materialize Covington campaign

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-campaign.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download audited campaign source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA='63fbe69c06b5cfc498b23ee6cd17182ad549e8dd'
          BASE="https://raw.githubusercontent.com/russelldudek/AIAction/${SOURCE_SHA}"
          files=(
            index.html styles.css app.js
            resume.html cover-letter.html interview-brief.html
            120-day-plan.html workflow-precedent-review.html source-notes.html
          )
          for file in "${files[@]}"; do
            curl -fL --retry 4 --retry-delay 2 "${BASE}/${file}" -o "${file}"
          done
          mkdir -p pdfs
          pdfs=(
            Russell-Dudek-Covington-Resume.pdf
            Russell-Dudek-Covington-Cover-Letter.pdf
            Russell-Dudek-Covington-Interview-Brief.pdf
            Russell-Dudek-Covington-120-Day-Plan.pdf
            Russell-Dudek-Covington-Workflow-Precedent-Review.pdf
          )
          for file in "${pdfs[@]}"; do
            curl -fL --retry 4 --retry-delay 2 "${BASE}/pdfs/${file}" -o "pdfs/${file}"
          done
          touch .nojekyll

      - name: Validate release before publishing
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Living Precedent Engine' index.html
          grep -q 'Build the common law of AI-enabled work' index.html
          test -s styles.css
          test -s app.js
          for file in pdfs/*.pdf; do
            test -s "$file"
            head -c 4 "$file" | grep -q '%PDF'
          done

      - name: Commit complete campaign to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css app.js resume.html cover-letter.html interview-brief.html 120-day-plan.html workflow-precedent-review.html source-notes.html pdfs .nojekyll
          git commit -m 'Publish Living Precedent Engine campaign'
          git push
