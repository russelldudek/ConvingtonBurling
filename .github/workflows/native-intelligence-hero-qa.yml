name: Native intelligence hero QA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-intelligence-hero-qa.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run native browser audit
        shell: bash
        run: |
          set +e
          exec >hero-qa.log 2>&1
          echo 'native QA started'
          date -u
          node --version
          npm --version
          node --check hero-intelligence.js
          grep -q 'intelligenceCanvas' index-direct.html
          grep -q 'hero-intelligence.css' index-direct.html
          echo 'installing playwright'
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
          cat > /tmp/check.mjs <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const target=process.argv[2];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];
          page.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto(target,{waitUntil:'networkidle',timeout:90000});
          await page.waitForSelector('#intelligenceCanvas');
          await page.waitForTimeout(1500);
          const state=await page.evaluate(()=>{const c=document.querySelector('#intelligenceCanvas'),g=c?.getContext('webgl2');return{treatment:document.body.dataset.treatment,mode:document.querySelector('#heroEngine')?.dataset.intelligenceMode,webgl:Boolean(g),version:g?.getParameter(g.VERSION)||'',width:c?.width||0,height:c?.height||0,legacy:document.querySelectorAll('.engine-layer').length,first:document.querySelector('.lab-controls>.control-group')?.id||'',cta:document.querySelector('.hero-primary')?.getAttribute('href')||'',overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
          assert.equal(state.treatment,'prototype');
          assert.equal(state.mode,'prototype');
          assert.equal(state.webgl,true);
          assert.ok(state.width>800&&state.height>500);
          assert.equal(state.legacy,0);
          assert.equal(state.first,'treatmentControls');
          assert.equal(state.cta,'#treatmentControls');
          assert.equal(state.overflow,0);
          await page.screenshot({path:'hero-desktop.png'});
          await page.locator('[data-stage="practice"]').click();
          await page.waitForFunction(()=>document.body.dataset.treatment==='practice'&&document.querySelector('#heroEngine')?.dataset.intelligenceMode==='practice');
          assert.equal(await page.locator('#heroTreatment').innerText(),'Practice pattern');
          await page.screenshot({path:'hero-practice.png'});
          await page.locator('.hero-primary').click();
          await page.waitForTimeout(700);
          await page.screenshot({path:'treatment-entry.png'});
          await page.setViewportSize({width:390,height:844});
          await page.goto(target,{waitUntil:'networkidle',timeout:90000});
          await page.waitForTimeout(900);
          assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth-document.documentElement.clientWidth),0);
          await page.screenshot({path:'hero-mobile.png'});
          assert.deepEqual(errors,[]);
          fs.writeFileSync('hero-state.json',JSON.stringify({target,state,errors,outcome:'success'},null,2));
          await browser.close();
          JS
          python3 -m http.server 4173 >/tmp/server.log 2>&1 & server=$!
          sleep 2
          echo 'local browser audit'
          node /tmp/check.mjs http://127.0.0.1:4173/index-direct.html
          local_code=$?
          kill "$server" || true
          echo "local code=$local_code"
          echo 'waiting for live asset equality'
          LIVE=https://russelldudek.github.io/ConvingtonBurling
          ready=0
          for i in $(seq 1 36); do
            if curl -fsS "$LIVE/hero-intelligence.js?x=$i" -o /tmp/live.js && cmp -s hero-intelligence.js /tmp/live.js; then ready=1;break;fi
            sleep 5
          done
          echo "live ready=$ready"
          if [ "$ready" = 1 ]; then
            echo 'live browser audit'
            node /tmp/check.mjs "$LIVE/index-direct.html"
            live_code=$?
          else
            live_code=99
          fi
          echo "live code=$live_code"
          if [ "$local_code" = 0 ] && [ "$live_code" = 0 ]; then echo success >hero-qa-outcome.txt; else echo failure >hero-qa-outcome.txt; fi
          exit 0
      - name: Commit native QA evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/native-intelligence-hero-qa.yml
          git add -f hero-qa.log hero-qa-outcome.txt hero-state.json hero-desktop.png hero-practice.png treatment-entry.png hero-mobile.png 2>/dev/null || true
          git commit -m "Record native intelligence hero QA"
          git push
