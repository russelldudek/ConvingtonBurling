name: Regenerate cover letter PDF

on:
  push:
    paths:
      - '.github/workflows/regenerate-cover-letter-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-cover-letter-pdf
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate corrected one-page PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pdfs
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/covington-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --no-pdf-header-footer \
            --print-to-pdf="${GITHUB_WORKSPACE}/pdfs/Russell-Dudek-Covington-Cover-Letter.pdf" \
            http://127.0.0.1:8000/cover-letter.html

          test -s pdfs/Russell-Dudek-Covington-Cover-Letter.pdf
          pdfinfo pdfs/Russell-Dudek-Covington-Cover-Letter.pdf | grep -q '^Pages:[[:space:]]*1$'
          pdftotext pdfs/Russell-Dudek-Covington-Cover-Letter.pdf - > /tmp/cover-letter.txt
          grep -Fq 'July 21, 2026' /tmp/cover-letter.txt
          if grep -Fq 'July 20, 2026' /tmp/cover-letter.txt; then
            echo 'Old date remains in generated PDF.' >&2
            exit 1
          fi

      - name: Publish corrected download and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/regenerate-cover-letter-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Update downloadable cover letter date to July 21 2026'
          git push origin HEAD:main
