name: Validate treatment interaction

on:
  push:
    branches: [main]
    paths:
      - app.js
      - treatment.css
      - qa/treatment-qa.mjs
      - .github/workflows/treatment-qa.yml

permissions:
  contents: write

jobs:
  rendered-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local campaign
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/covington-server.log 2>&1 &
          echo $! > /tmp/covington-server.pid
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/index-direct.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/covington-server.log
          exit 1

      - name: Validate local rendered source
        id: local
        continue-on-error: true
        env:
          QA_TARGET: http://127.0.0.1:4173/index-direct.html
          QA_PREFIX: local
        run: node qa/treatment-qa.mjs

      - name: Wait for GitHub Pages release
        id: pages
        continue-on-error: true
        run: |
          for attempt in {1..48}; do
            if curl -fsS https://russelldudek.github.io/ConvingtonBurling/app.js | grep -q 'const treatmentStages' \
              && curl -fsS https://russelldudek.github.io/ConvingtonBurling/treatment.css | grep -q 'treatment-summary'; then
              echo "Pages serves the treatment-aware release."
              exit 0
            fi
            sleep 10
          done
          echo "Pages did not expose the treatment-aware source before timeout."
          exit 1

      - name: Validate live rendered release
        id: live
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        env:
          QA_TARGET: https://russelldudek.github.io/ConvingtonBurling/index-direct.html
          QA_PREFIX: live
        run: node qa/treatment-qa.mjs

      - name: Write QA receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
          LOCAL_OUTCOME: ${{ steps.local.outcome }}
          PAGES_OUTCOME: ${{ steps.pages.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path('qa-output')
          out.mkdir(exist_ok=True)
          receipt = {
            'source_sha': os.environ['SOURCE_SHA'],
            'local_outcome': os.environ['LOCAL_OUTCOME'],
            'pages_release_outcome': os.environ['PAGES_OUTCOME'],
            'live_outcome': os.environ.get('LIVE_OUTCOME', 'skipped'),
            'outcome': 'success' if all(os.environ.get(key) == 'success' for key in ['LOCAL_OUTCOME','PAGES_OUTCOME','LIVE_OUTCOME']) else 'failure'
          }
          for name in ['local-report.json', 'live-report.json']:
            path = out / name
            if path.exists():
              receipt[name.removesuffix('.json')] = json.loads(path.read_text())
          (out / 'treatment-qa-receipt.json').write_text(json.dumps(receipt, indent=2))
          PY

      - name: Commit QA evidence
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add qa-output
          if git diff --cached --quiet; then
            echo "No QA evidence to commit."
          else
            git commit -m "Record treatment interaction QA"
            git push
          fi

      - name: Enforce QA result
        if: always()
        run: |
          test "${{ steps.local.outcome }}" = "success"
          test "${{ steps.pages.outcome }}" = "success"
          test "${{ steps.live.outcome }}" = "success"
