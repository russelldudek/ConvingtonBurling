name: Verify intelligence hero

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-intelligence-hero.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Create browser audit
        run: |
          cat > /tmp/verify-hero.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const target = process.argv[2];
          const prefix = process.argv[3];
          const out = 'qa-output';
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const checks = [];
          const check = (name, pass, detail='') => { checks.push({ name, pass, detail }); assert.ok(pass, `${name}: ${detail}`); };

          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
          page.on('pageerror', err => errors.push(err.message));
          await page.goto(target, { waitUntil: 'networkidle', timeout: 90000 });
          await page.waitForSelector('#intelligenceCanvas');
          await page.waitForTimeout(1500);

          check('page identity', (await page.title()).includes('Director of Applied AI'), await page.title());
          check('hero replaced', await page.locator('.hero-intelligence').count() === 1, 'hero-intelligence');
          check('legacy tower removed', await page.locator('.engine-layer').count() === 0, String(await page.locator('.engine-layer').count()));
          const gl = await page.locator('#intelligenceCanvas').evaluate(canvas => {
            const context = canvas.getContext('webgl2');
            return { ready: Boolean(context), width: canvas.width, height: canvas.height, version: context?.getParameter(context.VERSION) || '' };
          });
          check('WebGL2 intelligence field renders', gl.ready && gl.width > 800 && gl.height > 500, JSON.stringify(gl));
          check('prototype is the smart baseline', await page.evaluate(() => document.body.dataset.treatment) === 'prototype', await page.evaluate(() => document.body.dataset.treatment));
          check('hero state starts at prototype', await page.locator('#heroTreatment').innerText() === 'Matter prototype', await page.locator('#heroTreatment').innerText());
          check('Step 2 is the first control group', await page.locator('.lab-controls > .control-group').first().getAttribute('id') === 'treatmentControls', await page.locator('.lab-controls > .control-group').first().getAttribute('id'));
          check('hero CTA enters Step 2', await page.locator('.hero-primary').getAttribute('href') === '#treatmentControls', await page.locator('.hero-primary').getAttribute('href'));
          check('desktop has no horizontal overflow', await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth) === 0, String(await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)));
          await page.screenshot({ path: `${out}/${prefix}-hero-prototype.png`, fullPage: false });

          await page.locator('[data-stage="practice"]').click();
          await page.waitForFunction(() => document.body.dataset.treatment === 'practice' && document.querySelector('#heroEngine')?.dataset.intelligenceMode === 'practice');
          check('practice morph updates hero state', await page.locator('#heroTreatment').innerText() === 'Practice pattern', await page.locator('#heroTreatment').innerText());
          await page.screenshot({ path: `${out}/${prefix}-hero-practice.png`, fullPage: false });

          await page.locator('[data-stage="candidate"]').click();
          await page.locator('[data-stage="standard"]').click();
          await page.waitForFunction(() => document.body.dataset.treatment === 'standard' && document.querySelector('#heroEngine')?.dataset.intelligenceMode === 'standard');
          check('rapid selection leaves standard authoritative', await page.locator('#heroTreatment').innerText() === 'Firm standard', await page.locator('#heroTreatment').innerText());

          await page.locator('.hero-primary').click();
          await page.waitForTimeout(700);
          const treatmentBox = await page.locator('#treatmentControls').boundingBox();
          check('Step 2 scroll target is visible', Boolean(treatmentBox && treatmentBox.y >= 70 && treatmentBox.y < 500), JSON.stringify(treatmentBox));
          await page.screenshot({ path: `${out}/${prefix}-treatment-entry.png`, fullPage: false });

          await page.setViewportSize({ width: 390, height: 844 });
          await page.goto(target, { waitUntil: 'networkidle', timeout: 90000 });
          await page.waitForTimeout(1000);
          check('mobile has no horizontal overflow', await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth) === 0, String(await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth)));
          check('mobile WebGL canvas remains active', await page.locator('#intelligenceCanvas').evaluate(canvas => Boolean(canvas.getContext('webgl2'))), 'webgl2');
          await page.screenshot({ path: `${out}/${prefix}-hero-mobile.png`, fullPage: false });

          const reduced = await browser.newPage({ viewport: { width: 1280, height: 900 }, reducedMotion: 'reduce' });
          const reducedErrors = [];
          reduced.on('console', msg => { if (msg.type() === 'error') reducedErrors.push(msg.text()); });
          reduced.on('pageerror', err => reducedErrors.push(err.message));
          await reduced.goto(target, { waitUntil: 'networkidle', timeout: 90000 });
          await reduced.waitForTimeout(500);
          const reducedState = await reduced.evaluate(() => ({
            treatment: document.body.dataset.treatment,
            canvas: Boolean(document.querySelector('#intelligenceCanvas')?.getContext('webgl2')),
            atmosphere: getComputedStyle(document.querySelector('.hero-intelligence'), '::after').animationName,
            orbit: getComputedStyle(document.querySelector('.intelligence-stage'), '::after').animationName
          }));
          check('reduced motion resolves a complete static field', reducedState.treatment === 'prototype' && reducedState.canvas && reducedState.atmosphere === 'none' && reducedState.orbit === 'none', JSON.stringify(reducedState));
          errors.push(...reducedErrors);
          check('no browser errors', errors.length === 0, errors.join(' | '));

          fs.writeFileSync(`${out}/${prefix}-report.json`, JSON.stringify({ target, checks, errors, outcome: 'success' }, null, 2));
          await browser.close();
          JS
          python3 -m http.server 4173 >/tmp/covington-server.log 2>&1 &
          echo $! >/tmp/covington-server.pid
          sleep 2
          node /tmp/verify-hero.mjs http://127.0.0.1:4173/index-direct.html local
      - name: Wait for Pages release and verify live
        run: |
          LIVE=https://russelldudek.github.io/ConvingtonBurling
          ready=0
          for i in $(seq 1 36); do
            if curl -fsS "$LIVE/hero-intelligence.js?attempt=$i" -o /tmp/live-hero.js && cmp -s hero-intelligence.js /tmp/live-hero.js; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" = 1
          curl -fsS "$LIVE/" >/tmp/live-root.html
          grep -q 'index-direct.html' /tmp/live-root.html
          node /tmp/verify-hero.mjs "$LIVE/index-direct.html" live
      - name: Build visual review PDF
        run: |
          python3 -m pip install pillow >/dev/null
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files = [
            ('Live · prototype hero', 'qa-output/live-hero-prototype.png'),
            ('Live · practice morph', 'qa-output/live-hero-practice.png'),
            ('Live · Step 2 entry', 'qa-output/live-treatment-entry.png'),
            ('Live · mobile hero', 'qa-output/live-hero-mobile.png'),
          ]
          pages=[]
          for title, name in files:
              image=Image.open(name).convert('RGB')
              canvas=Image.new('RGB',(1600,1120),'white')
              draw=ImageDraw.Draw(canvas)
              draw.text((42,28),title,fill='black')
              fitted=ImageOps.contain(image,(1516,1020))
              canvas.paste(fitted,((1600-fitted.width)//2,82))
              pages.append(canvas)
          pages[0].save('qa-output/intelligence-hero-review.pdf',save_all=True,append_images=pages[1:])
          PY
      - name: Record temporary review evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/verify-intelligence-hero.yml
          git add qa-output
          git commit -m "Record intelligence hero rendered QA"
          git push
