name: Align intelligence field

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/align-intelligence-field.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align WebGL field with hero stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hero-intelligence.js')
          s = p.read_text()
          s = s.replace("uniform float uPointScale;\n      out float vSeed;", "uniform float uPointScale;\n      uniform float uOffsetX;\n      out float vSeed;")
          s = s.replace("vec2 projected = vec2(p.x / uAspect, p.y) * (2.45 / depth);\n        gl_Position", "vec2 projected = vec2(p.x / uAspect, p.y) * (2.45 / depth);\n        projected.x += uOffsetX;\n        gl_Position")
          s = s.replace("const mobile = window.matchMedia('(max-width: 720px)').matches;\n    const count", "const mobile = window.matchMedia('(max-width: 720px)').matches;\n    const stacked = window.matchMedia('(max-width: 900px)').matches;\n    const count")
          s = s.replace("gl.uniform1f(gl.getUniformLocation(activeProgram, 'uPointScale'), dpr * (mobile ? 2.3 : 2.7));\n      gl.uniform3f", "gl.uniform1f(gl.getUniformLocation(activeProgram, 'uPointScale'), dpr * (mobile ? 2.3 : 2.7));\n      gl.uniform1f(gl.getUniformLocation(activeProgram, 'uOffsetX'), stacked ? 0.0 : 0.34);\n      gl.uniform3f")
          p.write_text(s)
          PY
          node --check hero-intelligence.js
      - name: Commit alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/align-intelligence-field.yml
          git add hero-intelligence.js
          git commit -m "Align intelligence field with hero stage"
          git push
